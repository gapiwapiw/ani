<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#151413;--s1:#1c1b19;--s2:#242220;--s3:#2e2c29;--ln:rgba(255,245,235,.08);--tx:#e6e1da;--mut:#9a948b;--ac:#b34a43;--ac2:#d67a70;--onac:#fff3ee;--r1:6px;--r2:12px;--r3:20px;--e:cubic-bezier(.25,.1,.25,1);--d1:.12s;--d2:.2s;--d3:.3s;--ss:20px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0f0e0d;color:var(--tx);font:400 14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
#app{position:relative;width:min(100%,420px);height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}.ic.f{fill:currentColor;stroke:none}
.mut{color:var(--mut)}
/* header */
#hd{flex:none;padding:16px 16px 8px}
.brand svg{height:26px;width:auto;display:block}
#hd h1{font-size:22px;font-weight:600;line-height:1.2}
#qrow{display:none;gap:8px;align-items:center}#hd.search #qrow{display:flex}#hd.search .brand,#hd.search h1{display:none}
#q{flex:1;min-width:0;height:44px;padding:0 14px 0 40px;border-radius:var(--r2);border:1px solid var(--ln);background:var(--s1);color:var(--tx);font:inherit;font-size:16px;outline:0;transition:border-color var(--d2)}
#q:focus{border-color:var(--ac2)}#q::placeholder{color:var(--mut)}
#qw{flex:1;position:relative;display:flex}#qw .ic{position:absolute;left:12px;top:11px;width:20px;height:20px;color:var(--mut);pointer-events:none}
.seg{display:flex;background:var(--s1);border-radius:999px;padding:3px;flex:none}
.seg button{padding:6px 14px;border-radius:999px;color:var(--mut);font-size:14px;font-weight:500;transition:background-color var(--d2),color var(--d2)}
.seg .on{background:var(--s3);color:var(--tx)}
/* main */
main{flex:1;overflow-y:auto;padding:0 16px 24px;scrollbar-width:none}main::-webkit-scrollbar{display:none}
.tab{display:none}.tab.on{display:block;animation:fade var(--d3) var(--e)}
h2{font-size:14px;font-weight:500;color:var(--mut);margin:24px 0 12px;display:flex;justify-content:space-between;align-items:center}
h2 a{font-size:12px;color:var(--ac2);cursor:pointer}
/* posters */
.po{aspect-ratio:2/3;border-radius:var(--r2);background:hsl(var(--h) 14% 21%);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.po i{font-style:normal;font-size:28px;font-weight:500;color:hsl(var(--h) 14% 48%)}
.po .ic{width:28px;height:28px;color:var(--mut)}.po.none{background:var(--s2);border:1px dashed var(--s3)}
.po.sm{width:56px;flex:none;border-radius:var(--r1)}.po.sm i{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px}
.hrow{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}.hrow::-webkit-scrollbar{display:none}.hrow .card{width:108px;flex:none}
.card{cursor:pointer}.card .ct{margin-top:8px;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cs{margin-top:2px;font-size:12px;color:var(--mut)}
.pg{height:2px;background:var(--s3);border-radius:1px;margin-top:8px;overflow:hidden}.pg u{display:block;height:100%;background:var(--ac2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:6px 14px;border-radius:999px;background:var(--s1);font-size:14px;color:var(--tx)}
.chip.on{background:var(--s3)}
.empty{padding:56px 0;color:var(--mut);font-size:14px}.empty b{display:block;color:var(--tx);font-weight:500;font-size:16px;margin-bottom:4px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--r2);background:var(--ac);color:var(--onac);font-size:16px;font-weight:600;transition:opacity var(--d1)}
.btn:active{opacity:.8}.btn.ghost{background:var(--s2);color:var(--tx)}.btn.block{width:100%}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:var(--r2);transition:background-color var(--d1),opacity var(--d1)}
.ib:active{background:rgba(255,245,235,.1)}.ib.sq{background:var(--s2)}.ib.on{color:var(--ac2)}
/* list rows + download ring */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}.li:last-child{border:0}
.lt{flex:1;min-width:0}.lt b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lt small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.rg{position:relative;width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%}
.rg svg.r{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.rg circle{fill:none;stroke-width:2}
.rg .bg{stroke:var(--s3)}.rg .fg{stroke:var(--ac2);stroke-linecap:round}.rg[data-s=paused] .fg{stroke:var(--mut)}.rg[data-s=done] .fg{stroke:var(--mut)}.rg[data-s=done]{color:var(--tx)}
.rg .ic{width:18px;height:18px}
/* nav */
#nav{flex:none;display:flex;border-top:1px solid var(--ln);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;font-size:12px;color:var(--mut);position:relative;transition:color var(--d2)}
#nav .on{color:var(--tx)}#nav .on::before{content:"";position:absolute;top:-1px;left:50%;width:24px;height:2px;margin-left:-12px;background:var(--ac2);border-radius:1px}
.bdg{position:absolute;top:6px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--s3);color:var(--tx);font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* settings */
.set{background:var(--s1);border-radius:var(--r2);padding:0 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.row select{background:var(--s2);color:var(--tx);border:1px solid var(--ln);border-radius:var(--r1);padding:6px 8px;font:inherit}
input[type=range]{accent-color:var(--ac2);width:140px}
.about{padding:14px 0;color:var(--mut);font-size:12px;line-height:1.6}
/* overlays */
.ov{position:absolute;inset:0;z-index:10;background:var(--bg);overflow-y:auto;transform:translateX(100%);visibility:hidden;transition:transform var(--d3) var(--e),visibility 0s var(--d3);scrollbar-width:none}
.ov.open{transform:none;visibility:visible;transition:transform var(--d3) var(--e)}
#tb{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:4px;padding:8px 8px;height:60px;transition:background-color var(--d2)}
#tb.solid{background:var(--bg);border-bottom:1px solid var(--ln)}
#tb h3{flex:1;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity var(--d2)}#tb.solid h3{opacity:1}
#tb .ib{background:rgba(21,20,19,.6)}#tb.solid .ib{background:none}
#hero{height:300px;margin-top:-60px;position:relative;background:hsl(var(--h) 14% 21%);display:flex;align-items:center;justify-content:center}
#hero i{font-style:normal;font-size:96px;font-weight:500;color:hsl(var(--h) 14% 30%)}
#hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,var(--bg))}
#info{position:relative;margin-top:-48px;padding:0 16px;z-index:2}
#info h1{font-size:28px;font-weight:600;line-height:1.15}
.meta{display:flex;align-items:center;gap:12px;margin-top:8px;color:var(--mut);font-size:14px;flex-wrap:wrap}
.rt{border:1px solid var(--s3);border-radius:var(--r1);padding:0 6px;font-size:12px;color:var(--tx)}
.acts{display:flex;gap:8px;margin:16px 0}.acts .btn{flex:1}
#desc{color:rgba(230,225,218,.78);font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}#desc.full{-webkit-line-clamp:unset}
#more{display:inline-block;margin-top:4px;font-size:12px;color:var(--ac2);cursor:pointer}
#body{padding:0 16px 32px}
.eh{display:flex;align-items:center;justify-content:space-between;margin:24px 0 8px}.eh h2{margin:0;font-size:18px;font-weight:600;color:var(--tx)}
#seasons{display:flex;gap:20px;border-bottom:1px solid var(--ln);margin-bottom:8px}
#seasons button{padding:8px 0;color:var(--mut);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}#seasons .on{color:var(--tx);border-color:var(--tx)}
.er{display:flex;align-items:center;gap:12px;padding:8px 0}
.th{position:relative;width:44%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:hsl(var(--h) 14% 21%);flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:hsl(var(--h) 14% 42%);font-size:18px;font-weight:500}
.th .pb{position:absolute;left:0;bottom:0;height:2px;background:var(--ac2)}
.er.w .th,.er.w .tt b{opacity:.5}.er.cur .tt b{color:var(--ac2)}
.tt{flex:1;min-width:0;cursor:pointer}.tt small{display:block;color:var(--mut);font-size:12px}.tt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;font-size:14px;margin-top:2px;line-height:1.3}
/* sheet */
.sheet{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;visibility:hidden;opacity:0;transition:opacity var(--d2),visibility 0s var(--d2)}
.sheet.open{visibility:visible;opacity:1;transition:opacity var(--d2)}
.panel{width:100%;background:var(--s1);border-radius:var(--r3) var(--r3) 0 0;padding:8px 16px 24px;transform:translateY(24px);transition:transform var(--d3) var(--e)}.sheet.open .panel{transform:none}
.grab{width:32px;height:3px;border-radius:2px;background:var(--s3);margin:4px auto 16px}
.panel h3{font-size:18px;font-weight:600}.panel .sub{color:var(--mut);font-size:14px;margin:2px 0 16px}
.panel h4{font-size:14px;font-weight:500;color:var(--mut);margin:16px 0 8px}
.sl{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r2);background:var(--s2);margin-bottom:8px;cursor:pointer}.sl span{flex:1}.sl small{color:var(--mut);font-size:12px}
.ck{width:20px;height:20px;border-radius:var(--r1);border:1.5px solid var(--s3);display:flex;align-items:center;justify-content:center;flex:none}
.sl.on .ck{background:var(--ac);border-color:var(--ac);color:var(--onac)}.ck .ic{width:14px;height:14px;stroke-width:2.2;opacity:0}.sl.on .ck .ic{opacity:1}
/* player */
#pl{position:absolute;inset:0;z-index:40;background:#000;visibility:hidden;opacity:0;transition:opacity var(--d2),visibility 0s var(--d2);overflow:hidden;user-select:none}
#pl.open{visibility:visible;opacity:1;transition:opacity var(--d2)}
#vid{position:absolute;inset:0;background:linear-gradient(165deg,#24201e,#0c0b0b)}
#sub{position:absolute;left:8%;right:8%;bottom:96px;text-align:center;font-size:var(--ss);line-height:1.3;font-weight:500;color:#f2eee8;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6);transition:bottom var(--d3) var(--e);pointer-events:none}
#pl.hide #sub{bottom:32px}
#ui{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.6),transparent 22%,transparent 70%,rgba(0,0,0,.65));transition:opacity var(--d3)}#pl.hide #ui{opacity:0;pointer-events:none}
#ptop{position:absolute;top:8px;left:8px;right:8px;display:flex;align-items:center;gap:4px}
#ptop div{flex:1;min-width:0;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#ptop small{font-weight:400;color:rgba(230,225,218,.7);font-size:14px;margin-left:8px}
#mid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;gap:32px}
#mid button{display:flex;align-items:center;justify-content:center;border-radius:50%;transition:opacity var(--d1)}#mid button:active{opacity:.6}
#mid .ic{width:36px;height:36px}#mid #pp .ic{width:56px;height:56px}
#bot{position:absolute;left:16px;right:8px;bottom:12px;display:flex;align-items:center;gap:12px}
.tx{font-size:14px;min-width:44px;text-align:center}
#seek{-webkit-appearance:none;appearance:none;flex:1;height:32px;background:transparent;margin:0}
#seek::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--ac2) var(--v,0%),rgba(255,255,255,.25) var(--v,0%))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--tx);margin-top:-4.5px}
#seek::-moz-range-track{height:3px;background:rgba(255,255,255,.25)}#seek::-moz-range-progress{height:3px;background:var(--ac2)}#seek::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--tx)}
#mscrim{position:absolute;inset:0;z-index:5;display:none}#mscrim.open{display:block}
#menu{position:absolute;top:8px;right:8px;bottom:8px;width:min(300px,82%);background:var(--s1);border:1px solid var(--ln);border-radius:16px;z-index:6;overflow-y:auto;padding:8px;transform:translateX(16px);opacity:0;visibility:hidden;transition:transform var(--d3) var(--e),opacity var(--d2),visibility 0s var(--d3)}
#menu.open{transform:none;opacity:1;visibility:visible;transition:transform var(--d3) var(--e),opacity var(--d2)}
#menu h5{font-size:12px;font-weight:500;color:var(--mut);padding:12px 12px 4px}
#menu .r{display:flex;align-items:center;width:100%;text-align:left;padding:12px;border-radius:var(--r2);font-size:14px}#menu .r:active{background:rgba(255,245,235,.06)}
#menu .r.on{color:var(--ac2)}#menu .r span{flex:1}
#toast{position:absolute;left:50%;bottom:88px;transform:translate(-50%,8px);background:var(--s3);padding:8px 16px;border-radius:var(--r2);font-size:14px;opacity:0;pointer-events:none;z-index:80;transition:opacity var(--d2),transform var(--d2) var(--e);white-space:nowrap}#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style></head><body>

<div id="ui"><div id="ptop"><button class="ib" id="pback" aria-label="Close player"><svg class="ic"><use href="#i-back"/></svg></button><div id="ptt"></div><button class="ib" id="opt" aria-label="Options"><svg class="ic"><use href="#i-tune"/></svg></button></div>
<div id="mid"><button id="rw" aria-label="Back 10 seconds"><svg class="ic"><use href="#i-rw"/></svg></button><button id="pp" aria-label="Play or pause"><svg class="ic f"><use href="#i-pause"/></svg></button><button id="ff" aria-label="Forward 10 seconds"><svg class="ic"><use href="#i-ff"/></svg></button></div>
<div id="bot"><span class="tx" id="cur">9:40</span><input type="range" id="seek" min="0" max="1000" value="400" aria-label="Seek"><span class="tx" id="dur">24:10</span><button class="ib" aria-label="Fill screen"><svg class="ic"><use href="#i-expand"/></svg></button></div></div>
<div id="mscrim"></div>
<div id="menu"><h5>Quality</h5><button class="r on" data-g="q"><span>Auto</span></button><button class="r" data-g="q"><span>1080p</span></button><button class="r" data-g="q"><span>720p</span></button>
<h5>Subtitles</h5><button class="r" data-g="s"><span>Off</span></button><button class="r on" data-g="s"><span>English</span></button><button class="r" data-g="s"><span>Arabic</span></button>
<h5>Speed</h5><button class="r" data-g="p"><span>0.75×</span></button><button class="r on" data-g="p"><span>1×</span></button><button class="r" data-g="p"><span>1.25×</span></button><button class="r" data-g="p"><span>1.5×</span></button></div></div>
<div id="toast"></div>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const ic=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const S=[
{t:"Frieren: Beyond Journey's End",h:200,y:2023,n:28,r:'8.9',d:"After the party that defeated the Demon King disbands, an elf mage who outlives her old companions sets out to understand the short human lives she barely noticed. A quiet journey about time, memory and the people we only appreciate once they are gone."},
{t:"Dungeon Meshi",h:28,y:2024,n:24,r:'8.7',d:"A party is wiped out by a dragon, and the survivors go back down to rescue their friend before she is digested. With no money for supplies, they decide to eat the monsters."},
{t:"Violet Evergarden",h:260,y:2018,n:13,r:'8.5',d:"A former soldier learns to write letters for others and slowly works out what the last words she heard actually meant."},
{t:"That Time I Got Reincarnated as a Slime Season 3",h:150,y:2024,n:24,r:'8.1',d:"The slime ruler of Tempest continues to build his nation while larger powers take notice."},
{t:"Mushishi",h:110,y:2005,n:26,r:'8.7',d:"A wandering mushi master travels through rural Japan helping people affected by strange, primitive life forms."},
{t:"Cowboy Bebop",h:330,y:1998,n:26,r:'8.8',none:1,d:"Bounty hunters drift across the solar system, chasing paydays and running from their pasts."},
{t:"Monster",h:20,y:2004,n:74,r:'8.8',d:"A surgeon saves a boy's life, and years later learns what he has done."},
{t:"Haikyu!!",h:30,y:2014,n:25,r:'8.5',d:"A short boy with big ambitions joins a high school volleyball team with a fallen reputation."}];
const EP=["The Journey's End","It Didn't Have to Be Magic","Killing Magic","The Hero's Statue","Aura the Guillotine","A Pleasant Little Trip","Phantoms of the Dead","The Land Where Souls Rest","Winter Quiet","Dungeon Plans","Another Spring","The Third Examination"];
const po=(s,c='')=>`<div class="po ${s.none?'none':''} ${c}" style="--h:${s.h}">${s.none?ic('film'):`<i>${s.t[0]}</i>`}</div>`;
const card=(i,sub,p)=>`<div class="card" data-s="${i}">${po(S[i])}${p!=null?`<div class="pg"><u style="width:${p}%"></u></div>`:''}<div class="ct">${S[i].t}</div><div class="cs">${sub}</div></div>`;
const R=2*Math.PI*17;
const ring=(st,p)=>`<button class="rg" data-s="${st}" aria-label="Download state: ${st}"><svg class="r" viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="17"/><circle class="fg" cx="20" cy="20" r="17" stroke-dasharray="${R}" stroke-dashoffset="${R*(1-p/100)}"/></svg>${st==='done'?ic('check'):st==='run'?ic('pause'):st==='paused'?ic('play'):ic('dl')}</button>`;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)};

/* tabs */
const T={home:'',search:'',dl:'Downloads',set:'Settings'};
function tab(t){$$('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-'+t));$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 $('#hd').classList.toggle('search',t==='search');$('.brand').style.display=t==='home'?'':'none';$('#ht').textContent=T[t];$('#ht').style.display=T[t]?'':'none';}
$$('#nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
function home(){$('#t-home').innerHTML=`<h2>Continue watching</h2><div class="hrow">${card(0,'Episode 6, 14 min left',58)}${card(1,'Episode 3, 21 min left',22)}${card(3,'Next: episode 12')}</div>
<h2>My list</h2><div class="hrow">${card(2,'2018, 13 episodes')}${card(4,'2005, 26 episodes')}${card(5,'1998, 26 episodes')}</div>
<h2>Recently viewed <a>Clear</a></h2><div class="hrow">${card(6,'2004, 74 episodes')}${card(7,'2014, 25 episodes')}</div>`}
function search(q=''){const r=S.map((s,i)=>[s,i]).filter(([s])=>s.t.toLowerCase().includes(q.toLowerCase()));
 $('#recent').innerHTML=q?'':`<h2>Recent searches <a>Clear</a></h2><div class="chips">${['frieren','mushishi','slime'].map(x=>`<button class="chip" data-q="${x}">${x}</button>`).join('')}</div><h2>All titles</h2>`;
 $('#res').innerHTML=r.length?r.map(([s,i])=>card(i,s.y+', '+s.n+' episodes')).join(''):'';
 if(!r.length)$('#res').innerHTML=`<div class="empty" style="grid-column:1/-1"><b>No results for “${q}”</b>Check the spelling, or try the original Japanese title.</div>`;}
$('#q').oninput=e=>search(e.target.value);
$('#recent').onclick=e=>{const c=e.target.closest('.chip');if(c){$('#q').value=c.dataset.q;search(c.dataset.q)}};
function dls(){const D=[[0,2,'done',100,'312 MB'],[1,7,'run',62,'188 of 304 MB'],[4,8,'paused',30,'92 of 305 MB']];
 $('#t-dl').innerHTML=`<p class="mut" style="padding:4px 0 8px;font-size:12px">1 downloading, 1 paused, 1 finished</p>`+D.map(([i,e,st,p,sz])=>`<div class="li">${po(S[i],'sm')}<div class="lt"><b>${S[i].t}</b><small>Episode ${e}, ${sz}</small>${st!=='done'?`<div class="pg"><u style="width:${p}%"></u></div>`:''}</div>${ring(st,p)}</div>`).join('')}
function sets(){$('#t-set').innerHTML=`<h2>Playback</h2><div class="set"><div class="row"><span>Subtitle language</span><select><option>English</option><option>Arabic</option></select></div><div class="row"><span>Subtitle size</span><input type="range" id="ssz" min="16" max="30" value="20" aria-label="Subtitle size"></div><div class="row"><span>Default speed</span><select><option>1×</option><option>1.25×</option></select></div></div>
<h2>About</h2><div class="set"><div class="about"><b style="color:var(--tx);font-weight:500">ani</b> 2.0<br>Downloads, cached posters, history and settings live in the storage folder, so updating the app never touches them.</div></div>`;
 $('#ssz').oninput=e=>{$('#app').style.setProperty('--ss',e.target.value+'px');toast('Subtitle size '+e.target.value)}}
document.addEventListener('click',e=>{const r=e.target.closest('.rg');if(r&&r.closest('#t-dl,#eps')){const n={run:'paused',paused:'run'}[r.dataset.s];if(n){r.dataset.s=n;r.querySelector('use').setAttribute('href',n==='run'?'#i-pause':'#i-play');r.querySelector('.fg').style.stroke=''}}
 const c=e.target.closest('.card');if(c)open(+c.dataset.s)});
$$('.seg').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;$$('button',g).forEach(x=>x.classList.toggle('on',x===b))});

/* show page */
let cs=0;
function open(i){cs=i;const s=S[i];$('#hero').style.setProperty('--h',s.h);$('#hero').innerHTML=s.none?ic('film'):`<i>${s.t[0]}</i>`;
 $('#sname').textContent=s.t;$('#stitle').textContent=s.t;$('#smeta').innerHTML=`<span>${s.y}</span><span>${s.n} episodes</span><span class="rt">${s.r}</span>`;
 $('#desc').textContent=s.d;$('#desc').classList.remove('full');$('#more').style.display=s.d.length>140?'inline-block':'none';$('#more').textContent='More';
 $('#eps').innerHTML=EP.map((t,k)=>{const n=k+1,st=n===2?['done',100]:n===7?['run',62]:['idle',0];return`<div class="er ${n<6?'w':''} ${n===6?'cur':''}"><div class="th" data-p>${n}${n===6?'<div class="pb" style="width:58%"></div>':''}</div><div class="tt" data-p><small>Episode ${n}, 24 min</small><b>${t}</b></div>${ring(st[0],st[1])}</div>`}).join('');
 $('#show').scrollTop=0;$('#tb').classList.remove('solid');$('#show').classList.add('open')}
$('#show').onscroll=e=>$('#tb').classList.toggle('solid',e.target.scrollTop>180);
$('#sback').onclick=()=>$('#show').classList.remove('open');
$('#sheart').onclick=e=>{const b=e.currentTarget;b.classList.toggle('on');b.querySelector('svg').classList.toggle('f');toast(b.classList.contains('on')?'Added to my list':'Removed from my list')};
$('#slater').onclick=()=>toast('Saved to watch later');
$('#more').onclick=()=>{const f=$('#desc').classList.toggle('full');$('#more').textContent=f?'Less':'More'};
$('#sall').onclick=$('#dsheet').onclick=e=>{if(e.currentTarget.id==='sall')$('#dsheet').classList.add('open');else if(e.target===e.currentTarget||e.target.hasAttribute('data-close'))$('#dsheet').classList.remove('open')};
$$('#dsheet .sl').forEach(x=>x.onclick=()=>x.classList.toggle('on'));
$('#qs').onclick=e=>{const c=e.target.closest('.chip');if(c)$$('.chip',$('#qs')).forEach(x=>x.classList.toggle('on',x===c))};
$('#dgo').onclick=()=>{$('#dsheet').classList.remove('open');toast('Download started')};

/* player */
let tm=580,playing=true,iv;const D=1450,fm=x=>Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');
function paint(){$('#cur').textContent=fm(tm);$('#seek').value=tm/D*1000;$('#seek').style.setProperty('--v',tm/D*100+'%')}
function play(on){playing=on;$('#pp use').setAttribute('href',on?'#i-pause':'#i-play');clearInterval(iv);if(on)iv=setInterval(()=>{tm=Math.min(D,tm+1);paint()},1000)}
function openP(){$('#ptt').innerHTML=`${S[cs].t}<small>Episode 6</small>`;$('#pl').classList.remove('hide');$('#pl').classList.add('open');paint();play(true)}
$('#watch').onclick=openP;$('#eps').onclick=e=>{if(e.target.closest('[data-p]'))openP()};
$('#pback').onclick=()=>{$('#pl').classList.remove('open');play(false)};
$('#pp').onclick=()=>play(!playing);$('#rw').onclick=()=>{tm=Math.max(0,tm-10);paint()};$('#ff').onclick=()=>{tm=Math.min(D,tm+10);paint()};
$('#seek').oninput=e=>{tm=e.target.value/1000*D;paint()};
$('#vid').onclick=$('#sub').onclick=()=>$('#pl').classList.toggle('hide');
$('#opt').onclick=()=>{$('#menu').classList.add('open');$('#mscrim').classList.add('open')};
$('#mscrim').onclick=()=>{$('#menu').classList.remove('open');$('#mscrim').classList.remove('open')};
$('#menu').onclick=e=>{const b=e.target.closest('.r');if(!b)return;$$(`.r[data-g="${b.dataset.g}"]`).forEach(x=>x.classList.toggle('on',x===b));if(b.dataset.g==='s')$('#sub').style.visibility=b.textContent==='Off'?'hidden':''};
home();search();dls();sets();tab('home');
</script></body></html>
